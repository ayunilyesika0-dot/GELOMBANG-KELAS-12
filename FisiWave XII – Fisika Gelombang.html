<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FisiWave XII – Fisika Gelombang</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<script>window.MathJax={tex:{inlineMath:[['$','$']],displayMath:[['$$','$$']]},svg:{fontCache:'global'}}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js" async></script>
<style>
:root{--bg:#f6f2e6;--ink:#2e3b24;--sea:#5f8a3f;--coral:#d9486a;--card:#fffdf6;--line:#d6dcc0;--soft:#e6efd3;--btnt:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b2316;--ink:#eef3e2;--sea:#a9cc86;--coral:#ff8fa5;--card:#263220;--line:#3d4f33;--soft:#2f3d27;--btnt:#2a1018}}
:root[data-theme=dark]{--bg:#1b2316;--ink:#eef3e2;--sea:#a9cc86;--coral:#ff8fa5;--card:#263220;--line:#3d4f33;--soft:#2f3d27;--btnt:#2a1018}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:'Source Serif 4',Georgia,serif;font-size:17px;line-height:1.65;margin:0}
h1,h2,h3,.sans{font-family:'Bricolage Grotesque',system-ui,sans-serif}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.1rem 1.25rem}
.btn{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;background:var(--coral);color:var(--btnt);padding:.5rem 1rem;border-radius:10px;border:0;cursor:pointer}
.btn.alt{background:var(--soft);color:var(--ink)}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.tab{padding:.45rem .9rem;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-family:'Bricolage Grotesque',sans-serif;font-weight:600;white-space:nowrap}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg)}
.scroll-x{overflow-x:auto}
mjx-container{overflow-x:auto;overflow-y:hidden;max-width:100%}
.opt{display:block;width:100%;text-align:left;padding:.55rem .8rem;margin:.3rem 0;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer}
.ok{background:#bff0d4!important;color:#073b1f!important}.bad{background:#ffc9bd!important;color:#5a1304!important}
.cell{width:1.7rem;height:2rem;text-align:center;text-transform:uppercase;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;border-radius:5px;padding:0}
.slot{min-height:3.2rem;border:2px dashed var(--line);border-radius:10px;padding:.4rem;display:flex;align-items:center;justify-content:center;flex-wrap:wrap}
.fc{border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:.35rem .6rem;cursor:grab;display:inline-block;margin:.2rem}
.fc.sel{outline:3px solid var(--coral)}
ul.l{list-style:disc;padding-left:1.3rem}

.cm{display:grid;gap:14px;grid-template-columns:1fr}@media(min-width:640px){.cm{grid-template-columns:1fr 1fr}}
.pn{border:4px solid #111;border-radius:6px;box-shadow:5px 5px 0 #111;background-image:radial-gradient(rgba(0,0,0,.13) 1.2px,transparent 1.4px);background-size:9px 9px;padding:.6rem;min-height:15rem;display:flex;flex-direction:column;gap:.6rem;color:#111}
.pn .sc{font-size:3.2rem;text-align:center;line-height:1.15;flex:1;display:flex;align-items:center;justify-content:center}
.cap{background:#fff3a3;border:2px solid #111;font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:.85rem;padding:.3rem .5rem;line-height:1.35}
.bb{background:#fff;border:2px solid #111;border-radius:16px;padding:.4rem .75rem;font-size:.95rem;line-height:1.35;position:relative;max-width:92%;margin-bottom:9px}
.bb b{font-family:'Bricolage Grotesque',sans-serif;font-size:.75rem;display:block;color:#a8321a}
.bb.r{align-self:flex-end}
.bb:after{content:'';position:absolute;bottom:-9px;left:18px;border:8px solid transparent;border-top-color:#111;border-bottom:0}
.bb.r:after{left:auto;right:18px}
.fgrid{display:grid;gap:12px;grid-template-columns:1fr}@media(min-width:640px){.fgrid{grid-template-columns:1fr 1fr}}
.fm{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--coral);border-radius:12px;padding:.7rem 1rem;min-width:0}
.fn{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;color:var(--sea)}.ft{overflow-x:auto;padding:.2rem 0}.fk{font-size:.85rem;opacity:.8}
.pn,.bb,.cap{border-color:#2e3b24}.pn{box-shadow:5px 5px 0 #2e3b24}.bb:after{border-top-color:#2e3b24}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head>
<body>
<header class="sticky top-0 z-20" style="background:var(--ink);color:var(--bg);padding-top:env(safe-area-inset-top,0px)">
 <div class="max-w-4xl mx-auto px-4 py-2 flex items-center gap-3 flex-wrap">
  <div class="sans font-extrabold text-xl">FisiWave XII</div>
  <div class="text-sm opacity-80 hidden sm:block">Fisika Gelombang · Kelas XII SMA</div>
  <div class="ml-auto sans text-sm" id="mode">Beranda</div>
 </div>
 <nav class="max-w-4xl mx-auto px-4 pb-2 flex gap-2 scroll-x" role="tablist" id="nav"></nav>
</header>

<main class="max-w-4xl mx-auto px-4 py-6">
<!-- BERANDA -->
<section data-v="home">
 <div class="card" style="padding:0;overflow:hidden">
  <svg id="wv" viewBox="0 0 800 120" class="w-full" style="display:block;background:var(--soft)" aria-hidden="true"><path id="wp" fill="none" stroke="var(--sea)" stroke-width="4"/></svg>
  <div class="p-5">
   <h1 class="text-3xl sm:text-4xl font-extrabold">Selamat datang! Mari belajar gelombang.</h1>
   <p class="mt-2">Geser untuk mengubah frekuensi gelombang di atas, lalu pilih modul belajar.</p>
   <label class="sans text-sm">Frekuensi <input id="fr" type="range" min="1" max="8" value="3" class="align-middle"></label>
  </div>
 </div>
 <div class="grid sm:grid-cols-2 gap-4 mt-5" id="menu"></div>
</section>

<!-- MATERI -->
<section data-v="materi" hidden>
 <h2 class="text-2xl font-bold mb-3">Materi Lengkap Gelombang</h2>
 <div class="flex gap-2 scroll-x pb-2" id="mtabs"></div>

 <div id="mbody" class="mt-3"></div>
</section>

<!-- CERITA -->
<section data-v="cerita" hidden>
 <h2 class="text-2xl font-bold mb-3">Materi Cerita</h2>
 <div class="flex gap-2 scroll-x pb-2" id="stabs"></div>
 <div class="card mt-3" id="story"></div>
</section>

<!-- VIDEO -->
<section data-v="video" hidden>
 <h2 class="text-2xl font-bold mb-3">Video Interaktif</h2>
 <div class="card"><canvas id="vc" width="640" height="320" class="w-full" style="display:block;background:var(--soft);border-radius:10px"></canvas>
 <p class="sans font-semibold mt-2" id="sub" style="min-height:3rem"></p>
 <div class="flex items-center gap-2 mt-1"><button class="btn" id="pp">Putar</button><input type="range" id="seek" min="0" max="30" step="0.1" value="0" class="flex-1" aria-label="Linimasa video"><select id="spd" class="sans" aria-label="Kecepatan"><option value="1">1x</option><option value="0.5">0,5x</option><option value="2">2x</option></select></div>
 <div id="vq" class="mt-3" hidden></div></div>
</section>

<!-- KUIS -->
<section data-v="kuis" hidden>
 <div class="flex items-center justify-between mb-3"><h2 class="text-2xl font-bold">Latihan Soal</h2><div class="sans font-bold" id="score">Skor: 0 / 100</div></div>
 <div id="quiz" class="space-y-4"></div>
</section>

<!-- GAME -->
<section data-v="game" hidden>
 <h2 class="text-2xl font-bold mb-3">Lab Game Interaktif</h2>
 <div class="flex gap-2 mb-3"><button class="tab" role="tab" aria-selected="true" id="g1b">TTS Gelombang</button><button class="tab" role="tab" aria-selected="false" id="g2b">Seret Rumus</button></div>
 <div id="g1" class="card"></div>
 <div id="g2" class="card" hidden></div>
</section>
</main>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const typeset=()=>window.MathJax&&MathJax.typesetPromise?MathJax.typesetPromise():0;
/* Audio */
let AC;const tone=(f,t0,d,type='sine',g=.15)=>{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),a=AC.createGain();o.type=type;o.frequency.value=f;o.connect(a);a.connect(AC.destination);const t=AC.currentTime+t0;a.gain.setValueAtTime(g,t);a.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d)};
const ding=()=>{tone(880,0,.5);tone(1320,.1,.6)},buzz=()=>tone(110,0,.45,'sawtooth',.2),fanfare=()=>[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,i*.16,.3,'triangle'));

/* Navigasi */
const V=[['home','Beranda'],['materi','Materi'],['cerita','Cerita'],['video','Video'],['kuis','Latihan'],['game','Game']];
$('#nav').innerHTML=V.map(([k,n])=>`<button class="tab" role="tab" data-go="${k}" aria-selected="${k=='home'}">${n}</button>`).join('');
function go(k){$$('[data-v]').forEach(e=>e.hidden=e.dataset.v!=k);$$('[data-go]').forEach(b=>b.setAttribute('aria-selected',b.dataset.go==k));$('#mode').textContent=V.find(v=>v[0]==k)[1];scrollTo(0,0);typeset()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go)});
$('#menu').innerHTML=[['materi','📚 Materi Lengkap','Rumus, konsep, dan contoh dari 5 modul.'],['cerita','📖 Materi Cerita','Fisika lewat 4 kisah sehari-hari.'],['video','🎬 Video Interaktif','Animasi gelombang dengan pertanyaan di tengah video.'],['kuis','✍️ Latihan Soal','5 soal dengan bunyi benar/salah dan pembahasan.'],['game','🎮 Lab Game','TTS istilah dan seret-cocokkan rumus.']]
 .map(([k,t,d])=>`<button data-go="${k}" class="card text-left"><div class="sans text-xl font-bold">${t}</div><div>${d}</div></button>`).join('');

/* Gelombang hero */
let ph=0;const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
function draw(){const f=+$('#fr').value;let d='';for(let x=0;x<=800;x+=8)d+=(x?'L':'M')+x+' '+(60+40*Math.sin(x/800*f*6.283-ph));$('#wp').setAttribute('d',d);ph+=.04;if(!rm)requestAnimationFrame(draw)}
draw();$('#fr').oninput=()=>rm&&draw();

/* Materi tabs */
const MT=['Dasar','Berjalan & Stasioner','Bunyi','Cahaya','Spektrum GEM'];
$('#mtabs').innerHTML=MT.map((t,i)=>`<button class="tab" role="tab" data-mt="${i}" aria-selected="${i==0}">${i+1}. ${t}</button>`).join('');
const r=String.raw;
const M=[
{i:r`<p><b>Gelombang</b> adalah perambatan getaran yang memindahkan <b>energi dan momentum</b> tanpa memindahkan partikel medium secara permanen.</p><ul class="l"><li><b>Arah getar:</b> transversal (getar tegak lurus rambat; bukit–lembah; tali, cahaya) dan longitudinal (getar sejajar rambat; rapatan–renggangan; bunyi).</li><li><b>Amplitudo:</b> berjalan (amplitudo tetap) dan stasioner (amplitudo bergantung posisi).</li><li><b>Medium:</b> mekanik (perlu medium: bunyi, tali, air) dan elektromagnetik (bisa di ruang hampa: cahaya, radio, sinar-X).</li></ul>`,
f:[['Frekuensi',r`f=\frac{n}{t}=\frac{1}{T}`,'Satuan: hertz (Hz)'],['Periode',r`T=\frac{t}{n}=\frac{1}{f}`,'Satuan: sekon (s)'],['Panjang gelombang',r`\lambda=\frac{s}{n}`,'Satuan: meter (m)'],['Cepat rambat',r`v=\lambda f=\frac{\lambda}{T}`,'Satuan: m/s'],['Bilangan gelombang',r`k=\frac{2\pi}{\lambda}`,'Satuan: rad/m'],['Kecepatan sudut',r`\omega=2\pi f=\frac{2\pi}{T}`,'Satuan: rad/s'],['Fase gelombang',r`\varphi=\frac{t}{T}\mp\frac{x}{\lambda}`,'Tanpa satuan'],['Beda fase',r`\Delta\varphi=\frac{\Delta x}{\lambda}=\varphi_2-\varphi_1`,'Tanpa satuan']]},
{i:r`<p>Tanda pada persamaan: <b>+A</b> simpangan awal ke atas, <b>−A</b> ke bawah; <b>−kx</b> merambat ke kanan (sumbu X+), <b>+kx</b> ke kiri. Pada gelombang stasioner, jarak $x$ diukur dari ujung pantul.</p>`,
f:[['Gelombang berjalan',r`y=\pm A\sin(\omega t\mp kx+\theta_0)`,'A amplitudo (m)'],['Kecepatan partikel',r`v_p=\omega A\cos(\omega t\mp kx)`,'Turunan pertama y terhadap t'],['Percepatan partikel',r`a_p=-\omega^2A\sin(\omega t\mp kx)=-\omega^2y`,'Turunan kedua y terhadap t'],['Hukum Melde',r`v=\sqrt{\frac{F}{\mu}}=\sqrt{\frac{FL}{m}}=\sqrt{\frac{F}{\rho A}}`,'F tegangan (N), μ massa per panjang (kg/m)'],['Ujung terikat: simpangan',r`y=2A\sin(kx)\cos(\omega t)`,'Amplitudo $A_s=2A\sin(kx)$'],['Ujung terikat: letak',r`x_s=(n-1)\frac{\lambda}{2},\quad x_p=(2n-1)\frac{\lambda}{4}`,'Simpul dan perut ke-n'],['Ujung bebas: simpangan',r`y=2A\cos(kx)\sin(\omega t)`,'Amplitudo $A_s=2A\cos(kx)$'],['Ujung bebas: letak',r`x_p=(n-1)\frac{\lambda}{2},\quad x_s=(2n-1)\frac{\lambda}{4}`,'Perut dan simpul ke-n']]},
{i:r`<p>Bunyi adalah gelombang <b>longitudinal mekanik</b>. Cepat rambatnya bergantung pada sifat medium: padat ($E$ modulus Young), cair ($B$ modulus Bulk), gas ($\gamma$ konstanta Laplace, $T$ dalam kelvin).</p><p>Aturan tanda Doppler: pendengar mendekat $+v_p$, menjauh $-v_p$; sumber mendekat $-v_s$, menjauh $+v_s$. Ada angin: $v\to v\pm v_a$.</p>`,
f:[['Bunyi di zat padat',r`v=\sqrt{\frac{E}{\rho}}`,''],['Bunyi di zat cair',r`v=\sqrt{\frac{B}{\rho}}`,''],['Bunyi di gas',r`v=\sqrt{\frac{\gamma RT}{M}}`,''],['Pipa organa terbuka',r`f_n=(n+1)\frac{v}{2L}`,'n = 0, 1, 2, … ; rasio 1 : 2 : 3'],['Pipa organa tertutup',r`f_n=(2n+1)\frac{v}{4L}`,'n = 0, 1, 2, … ; rasio 1 : 3 : 5'],['Intensitas',r`I=\frac{P}{A}=\frac{P}{4\pi r^2}`,'Satuan: W/m²'],['Taraf intensitas',r`TI=10\log\frac{I}{I_0}`,'Satuan dB; $I_0=10^{-12}$ W/m²'],['N sumber identik',r`TI_N=TI_1+10\log N`,''],['Perubahan jarak',r`TI_2=TI_1-20\log\frac{r_2}{r_1}`,''],['Efek Doppler',r`f_p=\frac{v\pm v_p}{v\pm v_s}f_s`,''],['Pelayangan',r`f_{layang}=|f_1-f_2|`,'']]},
{i:r`<p>Cahaya memiliki sifat pemantulan, pembiasan, interferensi, difraksi, dan polarisasi. Pada interferensi dan difraksi, $n$ menyatakan orde pola.</p>`,
f:[['Pemantulan',r`\theta_i=\theta_r`,''],['Pembiasan (Snellius)',r`n_1\sin\theta_1=n_2\sin\theta_2,\quad n=\frac{c}{v}`,''],['Young: terang',r`\frac{d\,y}{L}=n\lambda`,'n = 0, 1, 2, …'],['Young: gelap',r`\frac{d\,y}{L}=\left(n-\tfrac12\right)\lambda`,'n = 1, 2, 3, …'],['Celah tunggal: gelap',r`d\sin\theta=n\lambda`,'n = 1, 2, 3, …'],['Celah tunggal: terang',r`d\sin\theta=\left(n+\tfrac12\right)\lambda`,'n = 1, 2, 3, …'],['Kisi difraksi',r`d\sin\theta=n\lambda,\quad d=\frac{1}{N}`,'N garis per cm'],['Sudut Brewster',r`\tan\theta_B=\frac{n_2}{n_1}`,'Polarisasi karena pemantulan'],['Hukum Malus',r`I_2=\tfrac12I_0\cos^2\theta`,r`Setelah polarisator: $I_1=\tfrac12I_0$`]]},
{i:r`<p>GEM merambat tanpa medium, bersifat transversal, dengan medan listrik $E$ dan magnet $B$ saling tegak lurus. Urutan dari frekuensi terendah ke tertinggi:</p><ol class="l" style="list-style:decimal"><li>Radio: siaran AM/FM, komunikasi jarak jauh.</li><li>Mikro: oven, Wi-Fi, radar.</li><li>Inframerah: remote, kamera termal, fisioterapi.</li><li>Cahaya tampak (me-ji-ku-hi-bi-ni-u), 400–700 nm.</li><li>Ultraviolet: vitamin D, sterilisasi, cek uang.</li><li>Sinar-X: foto rontgen, inspeksi bagasi.</li><li>Gamma: radioterapi, sterilisasi makanan, reaksi nuklir.</li></ol><p><b>Bahaya:</b> sinar-X dan gamma mengionisasi, dapat merusak DNA dan memicu mutasi sel atau kanker.</p>`,
f:[['Kecepatan GEM di ruang hampa',r`c=3\times10^{8}\ \text{m/s}`,''],['Hubungan dasar',r`c=\lambda f`,'Makin tinggi f, makin pendek λ']]}];
function renderM(n){const m=M[n];$('#mbody').innerHTML=`<div class="card mb-3">${m.i}</div><div class="fgrid">${m.f.map(f=>`<div class="fm"><div class="fn">${f[0]}</div><div class="ft">$$${f[1]}$$</div><div class="fk">${f[2]||''}</div></div>`).join('')}</div>`;typeset()}
$('#mtabs').onclick=e=>{const b=e.target.closest('[data-mt]');if(!b)return;$$('[data-mt]').forEach(x=>x.setAttribute('aria-selected',x==b));renderM(+b.dataset.mt)};renderM(0);

/* Cerita */
const S=[
{t:'Konser Arya & Efek Doppler',k:'#dcebc2',f:'Efek Doppler (sumber mendekat, pendengar diam): $f_p=\\frac{v}{v-v_s}f_s$. Sirene 700 Hz, $v_s=20$ m/s, $v=340$ m/s → $f_p=\\frac{340}{320}\\times700=743{,}75$ Hz. Gema terdengar jelas bila selisih waktu pantulan > 0,1 s.',p:[
['🎸🏟️🤩','Sabtu malam. Arya akhirnya menonton konser band favoritnya bersama sahabatnya, Dimas.',[['Arya','Dadaku ikut bergetar kena dentuman drumnya!']]],
['🥁〰️👂','Setiap pukulan drum menggetarkan udara.',[['Dimas','Itu gelombang longitudinal. Udara merapat lalu merenggang, dan energinya sampai ke telingamu.'],['Arya','Jadi udaranya tidak ikut pindah ke telingaku?'],['Dimas','Betul. Yang merambat energinya, bukan partikelnya.']]],
['🚑💨🔊','Di luar stadion, sebuah ambulans melaju dengan sirene menyala.',[['Arya','Aneh! Nada sirenenya tinggi waktu mendekat, lalu rendah waktu menjauh.']]],
['🚑➡️〰️〰️〰️','Gelombang di depan ambulans terhimpit, di belakangnya merenggang.',[['Dimas','Itu efek Doppler. Di depan sumber, λ memendek sehingga f yang kamu dengar naik.'],['Arya','Sirenenya sendiri tidak berubah nadanya?'],['Dimas','Tidak. Yang berubah hanya yang kamu dengar.']]],
['🏟️🗣️↩️','Arya berteriak ke arah tribun kosong.',[['Arya','HALOOO!'],['Gema','…haloo… …halo…'],['Dimas','Itu pemantulan bunyi. Gema jelas bila selisih waktunya lebih dari 0,1 sekon.']]],
['🧮🚑📝','Dimas mengeluarkan buku catatannya.',[['Dimas','Sirene 700 Hz, ambulans 20 m/s, cepat rambat bunyi 340 m/s. Coba hitung frekuensi yang kita dengar!'],['Arya','340 dibagi 320 dikali 700… 743,75 Hz! Pantas terdengar lebih tinggi.']]]]},
{t:'Misteri Pelangi Maya',k:'#ffd6de',f:'Hukum Snellius: $n_1\\sin\\theta_1=n_2\\sin\\theta_2$, dengan $n=\\frac{c}{v}$. Indeks bias tiap warna berbeda, sehingga cahaya putih terurai (dispersi). Ungu dibelokkan paling besar, merah paling kecil.',p:[
['🌧️☀️👧','Hujan reda. Maya berlari ke teras karena langit mulai terang.',[['Maya','Lihat, ada pelangi! Kenapa warnanya berurutan begitu?']]],
['💧🔆','Kakak Maya, Kak Raka, mengambil gelas berisi air dan menyorotkan senter.',[['Raka','Cahaya putih ini sebenarnya campuran banyak warna. Lihat saat masuk ke air.'],['Maya','Arahnya membelok!']]],
['🔦➡️💧📐','Cahaya melambat saat masuk air yang lebih rapat.',[['Raka','Itu pembiasan. Cahaya berpindah medium, kecepatannya berubah, arahnya ikut membelok sesuai hukum Snellius.']]],
['🌈🔺','Raka memegang prisma kaca ke arah matahari.',[['Raka','Tiap warna dibelokkan berbeda. Ungu paling besar, merah paling kecil.'],['Maya','Itu yang disebut dispersi?'],['Raka','Tepat sekali!']]],

const W=[['LONGITUDINAL','Gelombang dengan arah getar sejajar arah rambat'],['TRANSVERSAL','Arah getar tegak lurus arah rambat'],['POLARISASI','Penyaringan arah getar cahaya sehingga hanya satu arah lolos'],['INTERFERENSI','Perpaduan dua gelombang atau lebih'],['AMPLITUDO','Simpangan maksimum dari titik setimbang'],['STASIONER','Gelombang berdiri dengan simpul dan perut'],['RESONANSI','Ikut bergetarnya benda pada frekuensi alaminya'],['BERJALAN','Gelombang dengan amplitudo tetap di semua titik'],['SPEKTRUM','Rentang gelombang elektromagnetik'],['FREKUENSI','Jumlah getaran tiap sekon'],['REFRAKSI','Pembiasan; perubahan arah cahaya antarmedium'],['DIFRAKSI','Pelenturan gelombang saat melewati celah sempit'],['DISPERSI','Penguraian cahaya putih menjadi warna-warna'],['PERIODE','Waktu untuk satu getaran penuh'],['DOPPLER','Efek perubahan frekuensi akibat gerak relatif sumber–pendengar']];
$('#g1').innerHTML=`<p class="mb-3">Isi huruf tiap istilah sesuai petunjuk.</p>`+W.map((w,i)=>`<div class="mb-3"><div class="sans text-sm font-bold">${i+1}. ${w[1]} (${w[0].length} huruf)</div><div class="flex flex-wrap gap-1 mt-1" data-w="${i}">${[...w[0]].map((c,j)=>`<input class="cell" maxlength="1" aria-label="Kata ${i+1} huruf ${j+1}">`).join('')}</div></div>`).join('')+`<button class="btn" id="chk">Cek jawaban</button> <span class="sans font-bold ml-2" id="tr"></span>`;
$('#g1').addEventListener('input',e=>{if(e.target.value&&e.target.nextElementSibling)e.target.nextElementSibling.focus()});
$('#chk').onclick=()=>{let n=0;W.forEach((w,i)=>{const cs=$$(`[data-w="${i}"] input`);let all=1;cs.forEach((c,j)=>{const r=c.value.toUpperCase()==w[0][j];c.classList.toggle('ok',r);c.classList.toggle('bad',!r);if(!r)all=0});n+=all});$('#tr').textContent=`${n} / 15 kata benar`;n==15?fanfare():n<15&&buzz()};

/* Drag & drop */
const F=[['$v=\\lambda\\cdot f$','Cepat rambat gelombang'],['$y=A\\sin(\\omega t-kx)$','Gelombang berjalan'],['$A_s=2A\\sin(kx)$','Amplitudo stasioner ujung terikat'],['$f_p=\\frac{v\\pm v_p}{v\\pm v_s}f_s$','Efek Doppler'],['$TI=10\\log\\frac{I}{I_0}$','Taraf intensitas bunyi'],['$d\\sin\\theta=n\\lambda$','Interferensi terang Young'],['$I=\\frac{P}{4\\pi r^2}$','Intensitas gelombang'],['$\\Delta\\varphi=\\frac{\\Delta x}{\\lambda}$','Beda fase gelombang']];
let sel=null,placed={};const order=[...F.keys()].sort(()=>Math.random()-.5);
function mk(){$('#g2').innerHTML=`<p class="mb-2">Seret rumus ke namanya. Di layar sentuh, ketuk rumus lalu ketuk namanya.</p><div id="pool" class="mb-3"></div><div class="grid sm:grid-cols-2 gap-2">${F.map((f,i)=>`<div><div class="sans text-sm font-bold">${f[1]}</div><div class="slot" data-s="${i}"></div></div>`).join('')}</div><p class="sans font-bold mt-3" id="gr"></p>`;
 $('#pool').innerHTML=order.filter(i=>placed[i]===undefined).map(i=>`<span class="fc" draggable="true" tabindex="0" data-f="${i}">${F[i][0]}</span>`).join('');
 Object.entries(placed).forEach(([i,s])=>{$(`[data-s="${s}"]`).innerHTML=`<span class="fc" data-f="${i}">${F[i][0]}</span>`;$(`[data-s="${s}"]`).classList.add(+i==s?'ok':'bad')});typeset()}
function drop(f,s){if(f==null)return;if(Object.values(placed).includes(s))return;placed[f]=s;sel=null;+f==s?ding():buzz();mk();
 if(Object.keys(placed).length==8){const c=Object.entries(placed).filter(([i,s])=>+i==s).length;$('#gr').textContent=`${c} / 8 rumus cocok`;if(c==8)fanfare()}}
$('#g2').addEventListener('dragstart',e=>{const f=e.target.closest('[data-f]');if(f)e.dataTransfer.setData('t',f.dataset.f)});
$('#g2').addEventListener('dragover',e=>{if(e.target.closest('.slot'))e.preventDefault()});
$('#g2').addEventListener('drop',e=>{const s=e.target.closest('.slot');if(s){e.preventDefault();drop(+e.dataTransfer.getData('t'),+s.dataset.s)}});
$('#g2').addEventListener('click',e=>{const f=e.target.closest('#pool [data-f]'),s=e.target.closest('.slot');
 if(f){sel=+f.dataset.f;$$('.fc').forEach(x=>x.classList.toggle('sel',x==f))}else if(s&&sel!==null)drop(sel,+s.dataset.s)});
mk();
$('#g1b').onclick=()=>{g1.hidden=0;g2.hidden=1;g1b.setAttribute('aria-selected',1);g2b.setAttribute('aria-selected',0)};
$('#g2b').onclick=()=>{g1.hidden=1;g2.hidden=0;g2b.setAttribute('aria-selected',1);g1b.setAttribute('aria-selected',0);typeset()};
</script></body></html>
